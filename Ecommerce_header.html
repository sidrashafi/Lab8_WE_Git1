<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Grid Dashboard Solution</title>
  <link rel="stylesheet" href="style.css">
<style>
    .gallery-grid {
  display: grid;
  grid-template-columns: 220px 1fr 1fr 1fr;
  /*grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));*/

grid-template-rows: 300px minmax(300px, auto);
  gap: 20px;
  padding: 20px;
}
    .product-card {
  background: #ffffff;
  border: 1px solid #e0e0e0;
  border-radius: 8px;
  padding: 20px;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  background-image: url('mobile_pic.png');
}
.product-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 8px 16px rgba(0,0,0,0.1);
}
</style>
  
</head>
<body>
  <div class="dashboard-container">
    <header class="header">Header & Navbar</header>
    <aside class="sidebar">Sidebar Navigation</aside>
    <main class="main-content">Main Analytics Content Area

<div class="gallery-grid">
  <div class="product-card">Card 1</div>
  <div class="product-card">Card 2</div>
  <div class="product-card">Card 3</div>
  <div class="product-card">Card 4</div>
<!--
   <div class="product-card">Card 5</div>
  <div class="product-card">Card 6</div>
  <div class="product-card">Card 7</div>
  <div class="product-card">Card 8</div>-->
</div>

    </main>
    <section class="widget-a">Widget A (Stats)</section>
    <section class="widget-b">Widget B (Recent Activity)</section>
    <footer class="footer">Dashboard Footer &copy; 2026</footer>
  </div>
</body>
</html>
